server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome → cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache → o navegador sempre pega o build mais novo
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API do hub — proxy para o serviço `api` da stack.
    location /api/ {
        client_max_body_size 8m;
        proxy_pass http://api:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat IA (Sprint 6) usa streaming SSE — sem buffer.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA: qualquer rota desconhecida cai no index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
