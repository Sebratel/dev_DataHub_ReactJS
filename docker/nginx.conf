server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    # text/csv incluído: um export grande é o maior tráfego do sistema, e CSV
    # comprime perto de 10x. Com proxy_buffering off a compressão é streaming.
    gzip_types        text/plain text/css text/csv application/javascript application/json image/svg+xml;

    # Assets com hash no nome → cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache → o navegador sempre pega o build mais novo
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Export de conjunto — sem teto de linhas, então pode durar minutos. Fica
    # ANTES (location regex vence prefixo) só para afrouxar os tempos: o
    # proxy_read_timeout conta o intervalo ENTRE leituras, e o vão perigoso é o
    # início, quando o DuckDB ainda está ordenando e nada saiu.
    location ~ ^/api/v1/datasets/[^/]+/export {
        proxy_pass http://api:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # o arquivo vai direto para o cliente
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API do hub — proxy para o serviço `api` da stack.
    location /api/ {
        client_max_body_size 8m;
        proxy_pass http://api:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat IA (Sprint 6) usa streaming SSE — sem buffer.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA: qualquer rota desconhecida cai no index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
