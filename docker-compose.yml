name: datahub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: datahub-web:latest
    pull_policy: build
    container_name: datahub-web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m               # ← novo
    memswap_limit: 256m           # ← novo
    networks:
      - datahub
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8082}:80'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: datahub-api:latest
    pull_policy: build
    container_name: datahub-api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g                 # ← novo
    memswap_limit: 2g             # ← novo
    networks:
      - datahub
    depends_on:
      datahub-db:
        condition: service_healthy
    environment:
      API_PORT: 8790
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CONNECTIONS_SECRET: ${CONNECTIONS_SECRET:-}
      DATAHUB_DB_HOST: datahub-db
      DATAHUB_DB_PORT: 5432
      DATAHUB_DB_DATABASE: ${DATAHUB_DB_DATABASE:-datahub}
      DATAHUB_DB_USER: ${DATAHUB_DB_USER:-datahub}
      DATAHUB_DB_PASSWORD: ${DATAHUB_DB_PASSWORD:?defina DATAHUB_DB_PASSWORD na stack}
      ETL_HOUR: ${ETL_HOUR:-3}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-50000}
      SYNC_BATCH_PAUSE_MS: ${SYNC_BATCH_PAUSE_MS:-500}
      SYNC_STAGING_DIR: ${SYNC_STAGING_DIR:-}
      SOURCE_STATEMENT_TIMEOUT_MS: ${SOURCE_STATEMENT_TIMEOUT_MS:-120000}
      SYNC_MAX_ROWS: ${SYNC_MAX_ROWS:-30000000}
      # Motor de consulta (DuckDB) — ajustados pra caber no mem_limit da API
      DUCK_MEMORY_LIMIT: ${DUCK_MEMORY_LIMIT:-1500MB}    # ← reduzido de 2GB
      DUCK_THREADS: ${DUCK_THREADS:-4}
      DUCK_QUERY_TIMEOUT_MS: ${DUCK_QUERY_TIMEOUT_MS:-30000}
      DUCK_MAX_CONCURRENCY: ${DUCK_MAX_CONCURRENCY:-3}   # ← reduzido de 6
      # Fontes de dados
      DB_ELLEVEN_HOST: ${DB_ELLEVEN_HOST:-}
      # ... (todas as outras envs iguais) ...
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      EMBEDDINGS_CACHE_DIR: ${EMBEDDINGS_CACHE_DIR:-/app/.models}
    volumes:
      - datahub-lake:/app/data/lake
      - datahub-models:/app/.models
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8790/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  datahub-db:
    image: pgvector/pgvector:pg16
    container_name: datahub-db
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m               # ← novo
    memswap_limit: 768m           # ← novo
    networks:
      - datahub
    environment:
      POSTGRES_DB: ${DATAHUB_DB_DATABASE:-datahub}
      POSTGRES_USER: ${DATAHUB_DB_USER:-datahub}
      POSTGRES_PASSWORD: ${DATAHUB_DB_PASSWORD:-datahub-dev}
    ports:
      - '${DATAHUB_DB_PORT:-5433}:5432'
    volumes:
      - datahub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  datahub:
    driver: bridge

volumes:
  datahub-db-data:
  datahub-lake:
  datahub-models:
