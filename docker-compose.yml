name: datahub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
    image: datahub-web:latest
    pull_policy: build
    container_name: datahub-web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${WEB_MEM_LIMIT:-256m}      # nginx estático — leve
    memswap_limit: ${WEB_MEM_LIMIT:-256m}
    networks:
      - datahub
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8082}:80'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: datahub-api:latest
    pull_policy: build
    container_name: datahub-api
    restart: unless-stopped
    logging: *default-logging
    # Memória da API: aqui rodam Node + DuckDB + modelo de embeddings + a fila
    # de sincronização noturna. 12g com ~2g de swap de colchão: um pico grande
    # derrama pra swap em vez de tomar OOM na hora (que perdia a fila da noite).
    # Ajustável por env — dimensione conforme a RAM do host.
    mem_limit: ${API_MEM_LIMIT:-12g}
    memswap_limit: ${API_MEMSWAP_LIMIT:-14g}
    networks:
      - datahub
    depends_on:
      datahub-db:
        condition: service_healthy
    environment:
      API_PORT: 8790
      # Fuso do PROCESSO. O agendador compara a janela dos agendamentos com a
      # hora local do container (isWithinSchedule usa getHours/getDay), e a
      # MESMA função roda no navegador do admin ao decidir o auto-refresh da
      # dashboard. Sem isto o Node fica em UTC (a imagem base não define fuso)
      # e os dois discordam em 3h: uma janela "07:00-19:00" digitada em horário
      # de Brasília fecharia, de fato, às 16:00.
      TZ: ${TZ:-America/Sao_Paulo}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
      # Mesmo projeto do bundle do web. Definido = a API aceita ID token do
      # Firebase, conferindo a assinatura localmente (sem chamar o Google a
      # cada login). Vazio = só o caminho antigo.
      FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # ADMIN MASTER — unico que altera COMO as FONTES atualizam. Precisa estar
      # AQUI: este bloco lista as variaveis uma a uma, entao o que for definido
      # na stack sem constar nesta lista simplesmente nao chega ao container --
      # a variavel fica na tela do Portainer parecendo configurada, e a API
      # nunca a ve. Vazio = herda ADMIN_EMAILS.
      MASTER_ADMIN_EMAILS: ${MASTER_ADMIN_EMAILS:-}
      CONNECTIONS_SECRET: ${CONNECTIONS_SECRET:-}
      DATAHUB_DB_HOST: datahub-db
      DATAHUB_DB_PORT: 5432
      DATAHUB_DB_DATABASE: ${DATAHUB_DB_DATABASE:-datahub}
      DATAHUB_DB_USER: ${DATAHUB_DB_USER:-datahub}
      DATAHUB_DB_PASSWORD: ${DATAHUB_DB_PASSWORD:?defina DATAHUB_DB_PASSWORD na stack}
      ETL_HOUR: ${ETL_HOUR:-3}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-50000}
      SYNC_BATCH_PAUSE_MS: ${SYNC_BATCH_PAUSE_MS:-500}
      SYNC_STAGING_DIR: ${SYNC_STAGING_DIR:-}
      SOURCE_STATEMENT_TIMEOUT_MS: ${SOURCE_STATEMENT_TIMEOUT_MS:-120000}
      SYNC_MAX_ROWS: ${SYNC_MAX_ROWS:-30000000}
      # Teto de arquivos Parquet por conjunto antes de compactar mesmo sem ter
      # nada a colapsar (a compactacao so roda quando ha identidade repetida).
      SYNC_COMPACT_MAX_PARTS: ${SYNC_COMPACT_MAX_PARTS:-24}
      # Teto do DuckDB para UMA linha do JSONL de staging (uma linha da tabela).
      # O padrao dele e 16 MB e derruba a conversao quando alguma linha passa
      # disso. 64 MB por padrao: e buffer de leitura, nao memoria reservada.
      SYNC_MAX_JSON_OBJECT_BYTES: ${SYNC_MAX_JSON_OBJECT_BYTES:-67108864}
      # Motor de consulta (DuckDB) — teto GLOBAL do DuckDB (não é por consulta).
      # 6GB dentro dos 12g da API deixa ~6g pro Node + embeddings + SO. Consultas
      # e cargas grandes derramam pra disco (spill) em vez de estourar (OOM).
      DUCK_MEMORY_LIMIT: ${DUCK_MEMORY_LIMIT:-6144MB}
      DUCK_THREADS: ${DUCK_THREADS:-6}
      DUCK_QUERY_TIMEOUT_MS: ${DUCK_QUERY_TIMEOUT_MS:-30000}
      DUCK_MAX_CONCURRENCY: ${DUCK_MAX_CONCURRENCY:-3}
      # Pistas separadas: consulta ad-hoc (notebook, previa) e export nao podem
      # ocupar os slots dos paineis.
      DUCK_MAX_ADHOC_CONCURRENCY: ${DUCK_MAX_ADHOC_CONCURRENCY:-2}
      DUCK_MAX_EXPORT_CONCURRENCY: ${DUCK_MAX_EXPORT_CONCURRENCY:-1}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      GATEWAY_MAX_BODY: ${GATEWAY_MAX_BODY:-}
      # Fontes de dados (somente leitura — use usuário só-SELECT).
      DB_ELLEVEN_HOST: ${DB_ELLEVEN_HOST:-}
      DB_ELLEVEN_DATABASE: ${DB_ELLEVEN_DATABASE:-}
      DB_ELLEVEN_USER: ${DB_ELLEVEN_USER:-}
      DB_ELLEVEN_PASSWORD: ${DB_ELLEVEN_PASSWORD:-}
      DB_ELLEVEN_PORT: ${DB_ELLEVEN_PORT:-5432}
      DB_ELLEVEN_SSL: ${DB_ELLEVEN_SSL:-}
      DB_RADIUS_HOST: ${DB_RADIUS_HOST:-}
      DB_RADIUS_DATABASE: ${DB_RADIUS_DATABASE:-}
      DB_RADIUS_USER: ${DB_RADIUS_USER:-}
      DB_RADIUS_PASSWORD: ${DB_RADIUS_PASSWORD:-}
      DB_RADIUS_PORT: ${DB_RADIUS_PORT:-5432}
      DB_MARIA_HOST: ${DB_MARIA_HOST:-}
      DB_MARIA_DATABASE: ${DB_MARIA_DATABASE:-}
      DB_MARIA_USER: ${DB_MARIA_USER:-}
      DB_MARIA_PASSWORD: ${DB_MARIA_PASSWORD:-}
      DB_MARIA_PORT: ${DB_MARIA_PORT:-3306}
      DB_AUTOISP_HOST: ${DB_AUTOISP_HOST:-}
      DB_AUTOISP_DATABASE: ${DB_AUTOISP_DATABASE:-}
      DB_AUTOISP_USER: ${DB_AUTOISP_USER:-}
      DB_AUTOISP_PASSWORD: ${DB_AUTOISP_PASSWORD:-}
      DB_AUTOISP_PORT: ${DB_AUTOISP_PORT:-5432}
      DB_AUTOISP_SSL: ${DB_AUTOISP_SSL:-}
      # Lake (GCS) e integrações.
      BUCKET_GCP_NAME: ${BUCKET_GCP_NAME:-}
      PATH_CREDENTIALS: ${PATH_CREDENTIALS:-}
      # IA (chat com tools). Sem a chave, o resto do sistema funciona normal.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      EMBEDDINGS_CACHE_DIR: ${EMBEDDINGS_CACHE_DIR:-/app/.models}
    volumes:
      - datahub-lake:/app/data/lake
      - datahub-models:/app/.models
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8790/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  datahub-db:
    image: pgvector/pgvector:pg16
    container_name: datahub-db
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${DB_MEM_LIMIT:-3g}          # metadados + pgvector (embeddings)
    memswap_limit: ${DB_MEMSWAP_LIMIT:-3g}
    networks:
      - datahub
    environment:
      POSTGRES_DB: ${DATAHUB_DB_DATABASE:-datahub}
      POSTGRES_USER: ${DATAHUB_DB_USER:-datahub}
      POSTGRES_PASSWORD: ${DATAHUB_DB_PASSWORD:-datahub-dev}
    ports:
      - '${DATAHUB_DB_PORT:-5433}:5432'
    volumes:
      - datahub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  datahub:
    driver: bridge

volumes:
  datahub-db-data:
  datahub-lake:
  datahub-models:
