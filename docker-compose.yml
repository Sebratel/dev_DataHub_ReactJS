# Data Hub Sebratel — stack de produção (SPA via nginx + API + banco de metadados).
# Deploy no Portainer: Stacks → Add stack → Repository → branch main.
# Preencha as variáveis (credenciais das fontes, VITE_GOOGLE_CLIENT_ID etc.)
# nas "Environment variables" da stack — nada de segredo no git.
#
# Dev local: docker compose up -d datahub-db  (API e web via npm run dev:*)
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Client ID público do Google OAuth (variável de build do Vite).
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: datahub-web:latest
    # Imagem construída localmente (não existe em registry) → sempre buildar,
    # nunca puxar. Evita o 'pull access denied' no redeploy do Portainer.
    pull_policy: build
    container_name: datahub-web
    restart: unless-stopped
    networks:
      - datahub
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Porta do host (esquerda) configurável; 80 é a porta interna do nginx.
      - '${WEB_PORT:-8082}:80'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: datahub-api:latest
    pull_policy: build
    container_name: datahub-api
    restart: unless-stopped
    networks:
      - datahub
    depends_on:
      datahub-db:
        condition: service_healthy
    environment:
      API_PORT: 8790
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
      # CSV de e-mails com papel admin garantido no primeiro login.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Banco de metadados — resolve o serviço da stack pelo nome, porta interna.
      DATAHUB_DB_HOST: datahub-db
      DATAHUB_DB_PORT: 5432
      DATAHUB_DB_DATABASE: ${DATAHUB_DB_DATABASE:-datahub}
      DATAHUB_DB_USER: ${DATAHUB_DB_USER:-datahub}
      DATAHUB_DB_PASSWORD: ${DATAHUB_DB_PASSWORD:?defina DATAHUB_DB_PASSWORD na stack}
      # Ingestão — controle de carga (docs §9.1).
      ETL_HOUR: ${ETL_HOUR:-3}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-50000}
      SYNC_BATCH_PAUSE_MS: ${SYNC_BATCH_PAUSE_MS:-500}
      # Fontes de dados (somente leitura — use usuário só-SELECT).
      DB_ELLEVEN_HOST: ${DB_ELLEVEN_HOST:-}
      DB_ELLEVEN_DATABASE: ${DB_ELLEVEN_DATABASE:-}
      DB_ELLEVEN_USER: ${DB_ELLEVEN_USER:-}
      DB_ELLEVEN_PASSWORD: ${DB_ELLEVEN_PASSWORD:-}
      DB_ELLEVEN_PORT: ${DB_ELLEVEN_PORT:-5432}
      DB_ELLEVEN_SSL: ${DB_ELLEVEN_SSL:-}
      DB_RADIUS_HOST: ${DB_RADIUS_HOST:-}
      DB_RADIUS_DATABASE: ${DB_RADIUS_DATABASE:-}
      DB_RADIUS_USER: ${DB_RADIUS_USER:-}
      DB_RADIUS_PASSWORD: ${DB_RADIUS_PASSWORD:-}
      DB_RADIUS_PORT: ${DB_RADIUS_PORT:-5432}
      DB_MARIA_HOST: ${DB_MARIA_HOST:-}
      DB_MARIA_DATABASE: ${DB_MARIA_DATABASE:-}
      DB_MARIA_USER: ${DB_MARIA_USER:-}
      DB_MARIA_PASSWORD: ${DB_MARIA_PASSWORD:-}
      DB_MARIA_PORT: ${DB_MARIA_PORT:-3306}
      DB_AUTOISP_HOST: ${DB_AUTOISP_HOST:-}
      DB_AUTOISP_DATABASE: ${DB_AUTOISP_DATABASE:-}
      DB_AUTOISP_USER: ${DB_AUTOISP_USER:-}
      DB_AUTOISP_PASSWORD: ${DB_AUTOISP_PASSWORD:-}
      DB_AUTOISP_PORT: ${DB_AUTOISP_PORT:-5432}
      DB_AUTOISP_SSL: ${DB_AUTOISP_SSL:-}
      # Lake (GCS) e integrações — entram no Sprint 3.
      BUCKET_GCP_NAME: ${BUCKET_GCP_NAME:-}
      PATH_CREDENTIALS: ${PATH_CREDENTIALS:-}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8790/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Banco de METADADOS do hub (catálogo, usuários, dashboards, auditoria).
  # Interno à stack — sem porta exposta no host em produção.
  datahub-db:
    image: postgres:16-alpine
    container_name: datahub-db
    restart: unless-stopped
    networks:
      - datahub
    environment:
      POSTGRES_DB: ${DATAHUB_DB_DATABASE:-datahub}
      POSTGRES_USER: ${DATAHUB_DB_USER:-datahub}
      POSTGRES_PASSWORD: ${DATAHUB_DB_PASSWORD:-datahub-dev}
    # Em DEV, exponha para a API rodando fora do Docker (npm run dev:api):
    ports:
      - '${DATAHUB_DB_PORT:-5433}:5432'
    volumes:
      - datahub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  datahub:
    driver: bridge

volumes:
  datahub-db-data:
